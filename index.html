<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MONEY::CHANGE — ငွေလဲလှယ်စာရင်း</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel='stylesheet' href='https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;800;900&family=Noto+Sans+Myanmar:wght@400;500;700&display=swap'>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<style>
/* CSS ပိုင်းဆိုင်ရာများ (အတိုက္ချုံ့ထားသည်) */
:root { --bg: #0a0a0a; --text: #ffffff; --text-soft: #dadada; --accent: rgba(200,170,130, 1); --accent-soft: rgba(200,170,130, 0.25); --accent-dim: rgba(200,170,130, 0.45); --line: rgba(255,255,255,0.10); --line-soft: rgba(255,255,255,0.06); --danger: #d99a9a; --success: #9bc8a0; --warning: #e8a87c; --info: #7a9cc6; --ease-quiet: cubic-bezier(.22, 1, .36, 1); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); color: var(--text); font-family: 'Inter', 'Noto Sans Myanmar', sans-serif; font-weight: 400; line-height: 1.6; overflow-x: hidden; height: 100%; }
canvas.rain { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; opacity: 0.2; pointer-events: none; }
/* ကျန် HTML/CSS များကို သင့်ရဲ့ မူရင်း Code အတိုင်း ထည့်ထားပါ */
</style>
</head>
<body>

<!-- သင့်ရဲ့ HTML Body ပိုင်းဆိုင်ရာများ (Form, Menu, Table များ) ကို မူရင်းအတိုင်း ထည့်ထားပါ -->

<script>
// ============ TRANSLATIONS ============
const translations = { /* သင့်ရဲ့ ဘာသာပြန်စာများကို ဒီမှာ ထည့်ပါ */ };
function t(key) { const lang = state.lang || 'my'; return translations[lang][key] || translations['my'][key] || key; }

const STORAGE_KEY = 'moneychange_v21';
let state = { /* သင့်ရဲ့ State များကို ဒီမှာ ထည့်ပါ */ };
let currentRole = null;

// Database နဲ့ ချိတ်ဆက်ဖို့အတွက် API URL
const API_URL = '/api/state'; 

// ==========================================
// FIX 1: loadState Function (No async/await, fallback to localStorage)
// ==========================================
function loadState() {
  // 1. အရင်ဆုံး localStorage မှ ဒေတာတွေ အလျှင်အမြန် ဖတ်ယူပါတယ် (UI က အလောတကြောပြောင်းဖို့အတွက်)
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    try {
      const p = JSON.parse(saved);
      state = {...state, ...p};
    } catch (err) {}
  }

  // 2. Database API မှ ဒေတာတွေ ဆွဲယူပြီး Update လုပ်ပါမယ် (Background Sync)
  fetch(API_URL)
    .then(response => {
      if (!response.ok) throw new Error('Network response was not ok');
      return response.json();
    })
    .then(p => {
      if (p && Object.keys(p).length > 0) {
        state = {...state, ...p};
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        applyLanguage();
        renderAll(); // Database ကနေ ဒေတာ ရလျှင် မျက်နှာပြင်ကို ပြန်ရင်းပါမယ်
      }
    })
    .catch(err => console.error("API fetch error, using local data:", err));

  // 3. Data Validation (နှစ်ခုလုံးမှ ရလာသော data ကို စစ်ဆေးခြင်း)
  if (typeof state.balances.cash !== 'number') state.balances.cash = 0;
  state.accounts.forEach(a => { if (typeof state.balances[a] !== 'number') state.balances[a] = 0; });
  if (!state.accounts.includes(state.currentAccount)) state.currentAccount = state.accounts[0];
  if (!state.categories || Array.isArray(state.categories)) {
    state.categories = { income: ['Commission', 'Salary', 'Other Income'], expense: ['Rent', 'Food', 'Transport', 'Utility', 'Other Expense'] };
  }
  if (!state.userPermissions) {
    state.userPermissions = { canDelete: false, canAdjust: false, canLoans: false, canCapital: false, canCategories: false, canReports: true, canExport: true, canBackup: false };
  }
  if (!state.logs) state.logs = [];
  if (!state.transfers) state.transfers = [];
  if (!state.capital) state.capital = [];
  if (!state.loanTxCounter) state.loanTxCounter = 1;
  if (!state.loans) state.loans = [];
  state.loans.forEach(l => {
    if (!l.transactionId) { l.transactionId = `LN-${String(state.loanTxCounter).padStart(6, '0')}`; state.loanTxCounter++; }
    if (!l.payments) l.payments = [];
  });
  state.currentType = null;
}

// ==========================================
// FIX 2: saveState Function (Non-blocking API Save)
// ==========================================
function saveState() {
  // 1. ပုံမှန်အတိုင်း localStorage ထဲမှာ အရင်သိမ်းပါ (Instant UI အတွက်)
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  
  // 2. Cloudflare D1 Database ထဲကို Update တင်ပါမယ် (Background)
  fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(state)
  }).catch(err => console.error("Database save error:", err));
}

function fmt(n) { if (typeof n !== 'number' || isNaN(n)) n = 0; return Math.round(n).toLocaleString('en-US'); }
function isToday(ts) { const d = new Date(ts), n = new Date(); return d.toDateString() === n.toDateString(); }
function isAdmin() { return currentRole === 'admin'; }
function escapeHtml(s) { if(!s) return ''; return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(window._tt); window._tt = setTimeout(() => t.classList.remove('show'), 2200); }

/* ကျန် JS Functions များကို သင့်ရဲ့ မူရင်း Code အတိုင်း ဆက်ထည့်ပါ (renderBalances, renderTx, deleteTx, စသည်) */

// ==========================================
// FIX 3: App Initialization (No async/await block)
// ==========================================
// UI က အလောတကြော ပြသွားအောင် localStorage ကနေ အရင်ဖတ်ပြီး Database ကိုတော့ နောက်က Sync လုပ်ပါမယ်
loadState();
applyLanguage();
renderPinDisplay();

</script>

<!-- 
=========================================
BACKEND API CODE (Cloudflare Worker အတွက် နမူနာ)
ဒီ Code ကို သင့်ရဲ့ Server မှာ တင်ပေးရပါမည်။ (D1 Database သုံးထားပါသည်)
=========================================
export default {
  async fetch(request, env) {
    const corsHeaders = {
      'Access-Control-Allow-Origin': '*',
      'Access-Control-Allow-Methods': 'GET, POST, OPTIONS',
      'Access-Control-Allow-Headers': 'Content-Type',
    };
    if (request.method === 'OPTIONS') {
      return new Response(null, { headers: corsHeaders });
    }
    const url = new URL(request.url);
    if (url.pathname === '/api/state') {
      if (request.method === 'GET') {
        const result = await env.DB.prepare("SELECT data FROM app_state WHERE id = 1").first();
        return new Response(result ? result.data : '{}', { headers: { 'Content-Type': 'application/json', ...corsHeaders } });
      }
      if (request.method === 'POST') {
        const body = await request.text();
        await env.DB.prepare("INSERT OR REPLACE INTO app_state (id, data) VALUES (1, ?)").bind(body);
        return new Response('{"status":"ok"}', { headers: { 'Content-Type': 'application/json', ...corsHeaders } });
      }
    }
    return new Response('Not Found', { status: 404, headers: corsHeaders });
  }
};
-->
</body>
</html>
